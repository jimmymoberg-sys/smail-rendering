name: rendera

# Startas av n8n via workflow_dispatch. Ingen push-trigger med flit — repot ska
# aldrig rendera bara för att någon rättar en kommentar.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Hela specen som en JSON-STRÄNG (inte objekt — GitHub tar inte objekt)'
        required: true
        type: string
      filnamn:
        description: 'Filnamn för den färdiga MP4:an, t.ex. hedensbergsvagen-3.mp4'
        required: true
        type: string
      kvittens:
        description: 'Webhook-URL som ska pingas när filmen ligger uppe (valfri)'
        required: false
        type: string

jobs:
  rendera:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installera beroenden
        run: npm install --no-audit --no-fund

      - name: Installera Chromium
        run: npx playwright install --with-deps chromium

      - name: Skriv specen till fil
        env:
          SPEC: ${{ inputs.spec }}
        run: printf '%s' "$SPEC" > spec.json

      - name: Kontrollera att specen är giltig JSON
        # ★ --input-type=commonjs är INTE valfritt. package.json säger
        # "type": "module", och då körs även node -e som ESM, där require()
        # inte finns. Utan flaggan dör kontrollen på sin egen första rad
        # med exit 1 — vilket ser ut som att specen vore trasig fast den är hel.
        run: |
          node --input-type=commonjs -e "
            const fs = require('fs');
            const rå = fs.readFileSync('./spec.json', 'utf8');
            let s;
            try { s = JSON.parse(rå); }
            catch (e) {
              console.error('Specen är inte giltig JSON:', e.message);
              console.error('Första 300 tecknen:', rå.slice(0, 300));
              process.exit(2);
            }
            if (!s.klipp || !s.klipp.length) { console.error('Specen saknar klipp'); process.exit(2); }
            console.log('Spec OK:', s.klipp.length, 'klipp,', rå.length, 'tecken');
          "

      # Chromium-halvan. Avbryter med flit om Jost inte laddat.
      - name: Rita överläggen
        run: node overlagg.mjs spec.json

      # ★★ ffmpeg är INTE förinstallerat på ubuntu-latest.
      # Det fanns på Ubuntu 22.04 men togs bort ur 24.04-avbildningen, som är
      # vad ubuntu-latest pekar på. Felet blir "spawn ffmpeg ENOENT" i steget
      # nedan, vilket inte säger något om att paketet saknas.
      # Playwrights egen ffmpeg (i ~/.cache/ms-playwright) duger inte — den är
      # en avskalad build för skärminspelning, utan h264.
      - name: Installera ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # ffmpeg-halvan. Filnamnet skickas med som andra argument så att det
      # blir samma namn hela vägen till SFTP-uppladdningen.
      - name: Rendera filmen
        run: node rendera.mjs spec.json "${{ inputs.filnamn }}"

      - name: Visa resultatet
        run: ls -la ut/ && ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "ut/${{ inputs.filnamn }}"

      - name: Ladda upp till wasafast.se
        env:
          VARD: ${{ secrets.SFTP_VARD }}
          ANVANDARE: ${{ secrets.SFTP_ANVANDARE }}
          LOSENORD: ${{ secrets.SFTP_LOSENORD }}
          FILNAMN: ${{ inputs.filnamn }}
        run: |
          if [ -z "$VARD" ] || [ -z "$ANVANDARE" ] || [ -z "$LOSENORD" ]; then
            echo "AVBROTT: en eller flera SFTP-secrets saknas eller är felstavade."
            echo "Förväntade namn: SFTP_VARD, SFTP_ANVANDARE, SFTP_LOSENORD"
            exit 2
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$LOSENORD" sftp -o StrictHostKeyChecking=no -o BatchMode=no "$ANVANDARE@$VARD" <<EOF
          -mkdir /www/smail/some
          put ut/$FILNAMN /www/smail/some/$FILNAMN
          bye
          EOF
          echo "Uppladdad: https://wasafast.se/smail/some/$FILNAMN"

      # Kvittensen är hur n8n får veta att det gick vägen. Utan den vet flödet
      # ingenting — workflow_dispatch svarar 204 utan kropp direkt.
      - name: Kvittera till n8n
        if: ${{ inputs.kvittens != '' }}
        run: |
          curl -sS -X POST "${{ inputs.kvittens }}" \
            -H 'Content-Type: application/json' \
            -d "{\"ok\":true,\"filnamn\":\"${{ inputs.filnamn }}\",\"url\":\"https://wasafast.se/smail/some/${{ inputs.filnamn }}\",\"korning\":\"${{ github.run_id }}\"}"

      - name: Kvittera fel till n8n
        if: ${{ failure() && inputs.kvittens != '' }}
        run: |
          curl -sS -X POST "${{ inputs.kvittens }}" \
            -H 'Content-Type: application/json' \
            -d "{\"ok\":false,\"filnamn\":\"${{ inputs.filnamn }}\",\"korning\":\"${{ github.run_id }}\",\"logg\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
